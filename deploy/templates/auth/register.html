{% extends "base.html" %}

{% block title %}Register | TaskFlow{% endblock %}

{% block content %}
<section class="auth-card register-card">
    <h1>Register</h1>

    <form method="POST">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="form-field">
            <label for="full_name">Name</label>
            <input
                id="full_name"
                type="text"
                name="full_name"
                value="{{ request.form.get('full_name', '') }}"
                autocomplete="name"
                required
            >
        </div>

        <div class="form-field">
            <label for="email">Email</label>
            <input
                id="email"
                type="email"
                name="email"
                value="{{ request.form.get('email', '') }}"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-field">
            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-field">
            <label for="confirm_password">Confirm Password</label>
            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <button class="primary-button" type="submit">
            Sign Up
        </button>
    </form>

    <p class="auth-link">
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Log In</a>
    </p>
</section>
{% endblock %}
