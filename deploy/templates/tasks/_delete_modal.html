<div
    class="modal fade"
    id="deleteTaskModal{{ task.id }}"
    tabindex="-1"
    aria-labelledby="deleteTaskModalLabel{{ task.id }}"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered delete-task-modal">

        <div class="modal-content">

            <div class="delete-task-icon">
                <i class="bi bi-trash3"></i>
            </div>

            <h2 id="deleteTaskModalLabel{{ task.id }}">
                Drop Task?
            </h2>

            <p>
                Are you sure you want to drop
                <strong>{{ task.title }}</strong>?
            </p>

            <p class="delete-warning">
                The task will be marked as dropped and kept in your history.
            </p>

            <form
                action="{{ url_for('tasks.delete_task', task_id=task.id) }}"
                method="POST"
                data-disable-on-submit
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="delete-task-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="delete-button"
                    >
                        Drop Task
                    </button>

                </div>

            </form>

        </div>

    </div>
</div>
