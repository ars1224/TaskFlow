<div
    class="modal fade"
    id="editTaskModal{{ task.id }}"
    tabindex="-1"
    aria-labelledby="editTaskModalLabel{{ task.id }}"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered task-details-modal">
        <div class="modal-content">

            <form
                action="{{ url_for('tasks.edit_task', task_id=task.id) }}"
                method="POST"
                data-disable-on-submit
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="task-details-top">

                    <span class="task-details-status status-{{ task.status }}">
                        {% if task.status == "completed" %}
                            Finished
                        {% else %}
                            {{ task.status|replace("-", " ")|title }}
                        {% endif %}
                    </span>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>

                <h2
                    class="task-details-number"
                    id="editTaskModalLabel{{ task.id }}"
                >
                    Task #{{ "%05d"|format(task.id) }}
                </h2>

                <div class="form-field">
                    <label for="edit-title-{{ task.id }}">
                        Task Name:
                    </label>

                    <input
                        id="edit-title-{{ task.id }}"
                        type="text"
                        name="title"
                        maxlength="150"
                        value="{{ task.title }}"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="edit-description-{{ task.id }}">
                        Task Description:
                    </label>

                    <textarea
                        id="edit-description-{{ task.id }}"
                        name="description"
                        rows="4"
                        maxlength="2000"
                    >{{ task.description or "" }}</textarea>
                </div>

                <div class="form-field">
                    <label for="edit-priority-{{ task.id }}">
                        Priority:
                    </label>

                    <select
                        id="edit-priority-{{ task.id }}"
                        name="priority"
                        required
                    >
                        {% for value in ["low", "medium", "high"] %}
                            <option
                                value="{{ value }}"
                                {% if task.priority == value %}
                                    selected
                                {% endif %}
                            >
                                {{ value|title }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-field">
                    <label for="edit-due-date-{{ task.id }}">
                        Due Date:
                    </label>

                    <input
                        id="edit-due-date-{{ task.id }}"
                        type="date"
                        name="due_date"
                        value="{{ task.due_date.isoformat() }}"
                        required
                    >
                </div>

                <div class="task-edit-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Save
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>
